name: Verify public release
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run check:privacy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npx tsx scripts/test-release.ts --checkout
      - run: docker build -t motion-lab-verify .
      - run: |
          docker run --detach --rm --name motion-lab-verify --read-only --cap-drop ALL -p 127.0.0.1:4178:3000 motion-lab-verify
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:4178/ >/dev/null; then break; fi
            sleep 1
          done
          npx tsx scripts/smoke.ts http://127.0.0.1:4178
      - run: docker stop motion-lab-verify || true
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failures
          path: artifacts/browser
          retention-days: 3
