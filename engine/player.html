<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__MOTION_TITLE__</title>
    <link rel="icon" type="image/svg+xml" href="/motion-lab-icon.svg" />
    <script>
      /*__THEME__*/
    </script>
    <style>
      /* Motion Lab theme tokens. */
      :root {
        --bg: oklch(0.18 0.012 260);
        --surface: oklch(0.221 0.013 260);
        --surface-2: oklch(0.256 0.014 260);
        --border: oklch(0.32 0.014 260);
        --text: oklch(0.965 0.004 260);
        --muted: oklch(0.79 0.012 258);
        --faint: oklch(0.6 0.014 258);
        --blue: oklch(0.76 0.11 235);
        --green: oklch(0.79 0.15 152);
        --red: oklch(0.72 0.17 22);
        --amber: oklch(0.83 0.14 82);
        --purple: oklch(0.74 0.13 300);
        --context: oklch(0.42 0.014 260);
        --on-accent: oklch(0.18 0.012 260);
        --tok-keyword: #82d2ce;
        --tok-string: #e394dc;
        --tok-number: #ebc88d;
        --tok-comment: #f0f0f099;
        --tok-function: #efb080;
        --radius: 0.5rem;
        --mono: Menlo, Monaco, Consolas, 'SF Mono', monospace;
        --sans:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue',
          Helvetica, Arial, ui-sans-serif, system-ui, sans-serif;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme='dark']) {
          --bg: oklch(0.975 0.004 260);
          --surface: oklch(1 0 0);
          --surface-2: oklch(0.955 0.006 260);
          --border: oklch(0.88 0.008 260);
          --text: oklch(0.2 0.012 260);
          --muted: oklch(0.45 0.014 258);
          --faint: oklch(0.62 0.012 258);
          --blue: oklch(0.52 0.14 245);
          --green: oklch(0.55 0.15 152);
          --red: oklch(0.55 0.19 25);
          --amber: oklch(0.6 0.14 70);
          --purple: oklch(0.5 0.15 300);
          --context: oklch(0.78 0.01 260);
          --on-accent: oklch(1 0 0);
          --tok-keyword: #0f766e;
          --tok-string: #a21caf;
          --tok-number: #a94708;
          --tok-comment: #626976;
          --tok-function: #b63c0b;
          color-scheme: light;
        }
      }
      :root[data-theme='light'] {
        --bg: oklch(0.975 0.004 260);
        --surface: oklch(1 0 0);
        --surface-2: oklch(0.955 0.006 260);
        --border: oklch(0.88 0.008 260);
        --text: oklch(0.2 0.012 260);
        --muted: oklch(0.45 0.014 258);
        --faint: oklch(0.62 0.012 258);
        --blue: oklch(0.52 0.14 245);
        --green: oklch(0.55 0.15 152);
        --red: oklch(0.55 0.19 25);
        --amber: oklch(0.6 0.14 70);
        --purple: oklch(0.5 0.15 300);
        --context: oklch(0.78 0.01 260);
        --on-accent: oklch(1 0 0);
        --tok-keyword: #0f766e;
        --tok-string: #a21caf;
        --tok-number: #a94708;
        --tok-comment: #626976;
        --tok-function: #b63c0b;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.45 var(--sans);
        -webkit-font-smoothing: antialiased;
        font-variant-numeric: tabular-nums;
      }
      .mp {
        max-width: 1600px;
        margin: 0 auto;
        padding: 18px 20px 30px;
      }
      .mp-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 6px;
      }
      .mp-home {
        font-size: 13px;
        color: var(--muted);
        text-decoration: none;
      }
      .mp-home:hover {
        color: var(--blue);
      }
      .mp-head h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .mp-head p {
        margin: 4px 0 0;
        color: var(--muted);
      }
      .mp-gen {
        margin-top: 4px;
        font-size: 12px;
        color: var(--faint);
      }
      .mp-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin: 14px 0 10px;
      }
      .mp-tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .mp-btn,
      .mp-tab,
      .mp-edge {
        font: 600 12.5px/1 var(--sans);
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 8px 11px;
        cursor: pointer;
      }
      .mp-btn:hover,
      .mp-tab:hover,
      .mp-edge:hover {
        border-color: var(--blue);
      }
      .mp-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px 8px;
      }
      .mp-tab[aria-pressed='true'],
      .mp-btn[aria-pressed='true'] {
        background: var(--blue);
        border-color: var(--blue);
        color: var(--on-accent);
      }
      .mp-params {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: end;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) + 4px);
        background: var(--surface);
        margin-bottom: 10px;
      }
      .mp-params label {
        display: grid;
        gap: 4px;
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
      }
      .mp-params input,
      .mp-params select {
        font: 13px var(--mono);
        color: var(--text);
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 7px 8px;
        min-width: 90px;
      }
      .mp-params label.wide {
        flex: 1 1 100%;
      }
      .mp-select {
        position: relative;
        display: grid;
      }
      .mp-select select {
        appearance: none;
        padding-inline-end: 36px;
      }
      .mp-select::after {
        content: '';
        position: absolute;
        inset-inline-end: 14px;
        top: 50%;
        width: 7px;
        height: 7px;
        border-right: 1.5px solid var(--text);
        border-bottom: 1.5px solid var(--text);
        transform: translateY(-70%) rotate(45deg);
        pointer-events: none;
      }
      .mp-params textarea {
        font: 13px/19px var(--mono);
        color: var(--text);
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 8px 10px;
        width: 100%;
        box-sizing: border-box;
        resize: vertical;
        tab-size: 2;
      }
      .mp-params .mp-run {
        justify-self: start;
        font: 600 12.5px var(--sans, inherit);
        color: var(--text);
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .mp-params .mp-run:hover {
        border-color: var(--primary);
      }
      .mp-params .mp-hint {
        flex-basis: 100%;
        font-size: 12px;
        color: var(--muted);
      }
      .mp-edges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin: 0 0 10px;
      }
      .mp-edges .lbl {
        font-size: 12px;
        font-weight: 700;
        color: var(--amber);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-right: 4px;
      }
      .mp-edge {
        border-style: dashed;
        color: var(--amber);
      }
      .mp-edge[aria-pressed='true'] {
        background: var(--amber);
        color: var(--on-accent);
        border-style: solid;
        border-color: var(--amber);
      }
      [hidden] {
        display: none !important;
      }
      .mp-work {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
      }
      .mp-work.with-side {
        grid-template-columns: minmax(0, 1fr) 10px var(--side-w, 400px);
      }
      .mp-stages {
        display: grid;
        gap: 10px;
        grid-template-columns: minmax(0, 1fr);
      }
      .mp-work.compare-on .mp-caption {
        height: 150px;
      }
      .mp-stages.compare {
        grid-template-columns: minmax(0, var(--cmp-a, 1fr)) 10px minmax(0, var(--cmp-b, 1fr));
        gap: 0;
      }
      .mp-work.compare-on .mp-caption {
        height: 150px;
      }
      .mp-cmp-divider {
        cursor: col-resize;
        position: relative;
      }
      .mp-cmp-divider::before {
        content: '';
        position: absolute;
        top: 16px;
        bottom: 16px;
        left: 4px;
        width: 2px;
        border-radius: 2px;
        background: var(--border);
      }
      .mp-cmp-divider:hover::before,
      .mp-cmp-divider:focus-visible::before,
      .mp-cmp-divider.dragging::before {
        background: var(--blue);
        width: 3px;
      }
      .mp-main.max {
        position: fixed;
        inset: 0;
        z-index: 50;
        margin: 0;
        padding: 14px 20px 20px;
        background: var(--bg);
        overflow: auto;
      }
      .mp-main.max .mp-caption {
        height: 96px;
      }
      .mp-stage-wrap {
        position: relative;
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) + 4px);
        background: var(--surface);
        overflow: hidden;
      }
      .mp-stage-label {
        position: absolute;
        left: 10px;
        bottom: 8px;
        font: 700 11px var(--sans);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 3px 7px;
      }
      .mp-stage {
        display: block;
        width: 100%;
        height: auto;
      }
      .mp-badge {
        margin: 8px 8px 0;
        padding: 7px 10px;
        border-radius: 8px;
        border: 1px solid var(--amber);
        background: color-mix(in oklch, var(--amber) 16%, var(--surface));
        color: var(--text);
        font-size: 12.5px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
      }
      .mp-badge b {
        color: var(--amber);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        font-size: 11px;
        display: block;
      }
      .mp-overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: color-mix(in oklch, var(--bg) 55%, transparent);
      }
      .mp-bigplay {
        font: 700 16px var(--sans);
        color: var(--on-accent);
        background: var(--blue);
        border: 0;
        border-radius: 999px;
        padding: 14px 24px;
        cursor: pointer;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      }
      .mp-predict {
        max-width: 480px;
        margin: 16px;
        padding: 16px 18px;
        border-radius: 12px;
        border: 1px solid var(--amber);
        background: var(--surface);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      .mp-predict h2 {
        margin: 0 0 6px;
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--amber);
      }
      .mp-predict p {
        margin: 0 0 12px;
        font-size: 16px;
      }
      .mp-predict .mp-answer {
        color: var(--muted);
        font-size: 14px;
        border-top: 1px solid var(--border);
        padding-top: 10px;
        margin-top: 4px;
      }
      .mp-caption {
        margin-bottom: 10px;
        height: 118px;
        overflow-y: auto;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-left: 4px solid var(--blue);
        border-radius: 10px;
        background: var(--surface);
        min-height: 74px;
      }
      .mp-caption .mp-count {
        font: 600 12px var(--mono);
        color: var(--muted);
      }
      .mp-caption h2 {
        margin: 2px 0 3px;
        font-size: 16px;
      }
      .mp-caption p {
        margin: 0;
      }
      .mp-caption .mp-cap-b {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px dashed var(--border);
        color: var(--muted);
        font-size: 14px;
      }
      .mp-caption[data-tone='failure'] {
        border-left-color: var(--red);
      }
      .mp-caption[data-tone='success'] {
        border-left-color: var(--green);
      }
      .mp-caption[data-tone='warning'] {
        border-left-color: var(--amber);
      }
      .mp-transport {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        align-items: center;
        margin-top: 10px;
      }
      .mp-transport .mp-group {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .mp-time {
        font: 12px var(--mono);
        color: var(--muted);
        min-width: 92px;
        text-align: right;
      }
      .mp-scrub {
        position: relative;
        height: 34px;
      }
      .mp-scrub input {
        position: absolute;
        inset: 9px 0 auto;
        width: 100%;
        margin: 0;
        accent-color: var(--blue);
      }
      .mp-ticks {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 8px;
        pointer-events: none;
      }
      .mp-tick {
        position: absolute;
        top: 0;
        width: 2px;
        height: 8px;
        background: var(--faint);
      }
      .mp-tick.predict {
        background: var(--amber);
      }
      .mp-chapters {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      .mp-chapter {
        font: 12px var(--sans);
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 5px 10px;
        cursor: pointer;
      }
      .mp-chapter[aria-current='true'] {
        color: var(--text);
        border-color: var(--blue);
        background: color-mix(in oklch, var(--blue) 16%, transparent);
      }
      .mp-opts {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        font-size: 13px;
        color: var(--muted);
        margin-top: 10px;
      }
      .mp-opts label {
        display: flex;
        gap: 6px;
        align-items: center;
        cursor: pointer;
      }
      .mp-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .mp-legend span::before {
        content: '';
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        margin-right: 5px;
        vertical-align: -1px;
        background: var(--c);
      }
      /* side panel: inspector / code / complexity, one at a time (as in the step walkthroughs) */
      .mp-side {
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) + 4px);
        background: var(--surface);
        overflow: hidden;
        align-self: start;
      }
      .mp-side-tabs {
        display: flex;
        gap: 4px;
        padding: 6px;
        border-bottom: 1px solid var(--border);
      }
      .mp-side-tabs button {
        flex: 1;
        font: 600 12px var(--sans);
        color: var(--muted);
        background: transparent;
        border: 0;
        border-radius: 6px;
        padding: 6px 8px;
        cursor: pointer;
      }
      .mp-side-tabs button[aria-selected='true'] {
        background: var(--surface-2);
        color: var(--text);
      }
      .mp-side-tabs .close {
        flex: 0 0 auto;
      }
      .mp-inspector {
        padding: 10px 12px 12px;
        font-size: 13px;
      }
      .mp-inspector h3 {
        margin: 10px 0 4px;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .mp-inspector h3:first-child {
        margin-top: 0;
      }
      .mp-kv {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        padding: 4px 6px;
        border-radius: 6px;
      }
      .mp-kv .k {
        color: var(--muted);
      }
      .mp-kv .v {
        font-family: var(--mono);
        text-align: right;
      }
      .mp-kv.changed {
        background: color-mix(in oklch, var(--blue) 18%, transparent);
      }
      .mp-kv.changed .v {
        color: var(--blue);
        font-weight: 700;
      }
      .mp-kv.flight .v {
        color: var(--purple);
      }
      .mp-rowlist {
        margin: 2px 0 4px;
        padding-left: 6px;
        font: 12px var(--mono);
        color: var(--text);
      }
      .mp-rowlist div {
        padding: 2px 4px;
        border-left: 2px solid var(--border);
      }
      .mp-rowlist div.new {
        border-left-color: var(--blue);
        color: var(--blue);
      }
      .mp-code {
        background: var(--surface);
        color: var(--text);
      }
      .mp-code-body {
        padding: 9px 0;
        font: 13px/20px var(--mono);
        tab-size: 2;
        overflow-x: auto;
      }
      .mp-code .ln {
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr);
        min-height: 20px;
        padding-right: 12px;
        border-left: 3px solid transparent;
      }
      .mp-code .ln.on {
        border-left-color: var(--blue);
        background: var(--surface-2);
      }
      .mp-code .ln .no {
        padding-right: 9px;
        color: var(--muted);
        text-align: right;
        user-select: none;
      }
      .mp-code .ln .src {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        min-width: 0;
      }
      /* Code and inline fragments follow the active theme. */
      .mp-code .tok-keyword,
      .mp-inline .tok-keyword {
        color: var(--tok-keyword);
      }
      .mp-code .tok-string,
      .mp-inline .tok-string {
        color: var(--tok-string);
      }
      .mp-code .tok-number,
      .mp-inline .tok-number {
        color: var(--tok-number);
      }
      .mp-code .tok-comment,
      .mp-inline .tok-comment {
        color: var(--tok-comment);
        font-style: italic;
      }
      .mp-code .tok-function,
      .mp-code .tok-type,
      .mp-inline .tok-function,
      .mp-inline .tok-type {
        color: var(--tok-function);
      }
      :is(.mp-caption, .mp-predict, .mp-badge, .mp-cx, .mp-chapter) .tok-number {
        color: var(--tok-number);
        font-weight: 600;
      }
      :is(.mp-caption, .mp-predict, .mp-badge, .mp-cx, .mp-chapter) .tok-string {
        color: var(--tok-string);
      }
      :is(.mp-caption, .mp-predict, .mp-badge, .mp-cx, .mp-chapter)
        :is(.tok-keyword, .tok-function) {
        color: var(--tok-keyword);
        font-family: var(--mono);
        font-size: 0.93em;
      }
      :is(.mp-caption, .mp-predict, .mp-badge, .mp-cx, .mp-chapter) .tok-function {
        color: var(--tok-function);
      }
      .mp-inline {
        font: 0.92em var(--mono);
        background: var(--surface);
        color: var(--text);
        border-radius: 5px;
        padding: 1px 5px;
      }
      .mp-cx {
        padding: 12px 14px;
        font-size: 13.5px;
      }
      .mp-cx .metric {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 10px;
      }
      .mp-cx .metric div {
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface-2);
      }
      .mp-cx .metric strong {
        display: block;
        margin-top: 3px;
        color: var(--green);
        font: 700 18px var(--mono);
      }
      .mp-cx p {
        margin: 6px 0;
        color: var(--muted);
      }
      .mp-ref h4 {
        margin: 12px 0 4px;
        font-size: 12px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .mp-ref ul {
        margin: 0;
        padding-left: 18px;
      }
      .mp-ref li {
        margin: 4px 0;
      }
      svg .tok-keyword {
        fill: var(--tok-keyword);
      }
      svg .tok-string {
        fill: var(--tok-string);
      }
      svg .tok-number {
        fill: var(--tok-number);
      }
      svg .tok-comment {
        fill: var(--tok-comment);
        font-style: italic;
      }
      svg .tok-function,
      svg .tok-type {
        fill: var(--tok-function);
      }
      .mp-divider {
        cursor: col-resize;
        position: relative;
        border-radius: 6px;
      }
      .mp-divider::before {
        content: '';
        position: absolute;
        top: 12px;
        bottom: 12px;
        left: 4px;
        width: 2px;
        border-radius: 2px;
        background: var(--border);
      }
      .mp-divider:hover::before,
      .mp-divider:focus-visible::before,
      .mp-divider.dragging::before {
        background: var(--blue);
        width: 3px;
      }
      :focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }

      /* SVG scene */
      .s-lane {
        fill: color-mix(in oklch, var(--surface-2) 70%, transparent);
        stroke: var(--border);
        stroke-dasharray: 4 4;
      }
      .s-lane-label {
        fill: var(--muted);
        font: 600 13px var(--sans);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .s-link {
        fill: none;
        stroke: var(--context);
        stroke-width: 1.6;
      }
      .s-link.active {
        stroke: var(--blue);
        stroke-width: 2.4;
        stroke-dasharray: 7 6;
        animation: flow 0.6s linear infinite;
      }
      .s-link-label {
        fill: var(--muted);
        font: 13px var(--mono);
      }
      @keyframes flow {
        to {
          stroke-dashoffset: -26;
        }
      }
      .s-shape {
        fill: var(--surface-2);
        stroke: var(--context);
        stroke-width: 1.6;
      }
      .s-label {
        fill: var(--text);
        font: 600 17px var(--sans);
      }
      .s-label.s-small {
        font: 600 13px var(--mono);
      }
      .s-label.s-prose {
        font: 500 14.5px var(--sans);
      }
      .s-sub {
        fill: var(--muted);
        font: 14px var(--mono);
      }
      .s-value {
        fill: var(--text);
        font: 700 24px var(--mono);
      }
      .s-value.s-vsm {
        font: 600 14px var(--mono);
      }
      .s-row {
        fill: var(--text);
        font: 13px var(--mono);
      }
      .s-row-bg {
        fill: var(--surface);
        stroke: var(--border);
      }
      .s-row-new .s-row-bg {
        stroke: var(--blue);
      }
      .s-text {
        fill: var(--muted);
        font: 16px var(--sans);
      }
      .s-cell {
        fill: var(--surface-2);
        stroke: var(--context);
        stroke-width: 1.4;
      }
      .s-cell-v {
        fill: var(--text);
        font: 700 20px var(--mono);
      }
      .s-cell-i {
        fill: var(--faint);
        font: 13px var(--mono);
      }
      .s-ptr text {
        font: 700 15px var(--mono);
      }
      .s-packet rect {
        stroke-width: 1.5;
      }
      .s-packet text {
        fill: var(--on-accent);
        font: 700 13px var(--mono);
      }
      .s-packet text tspan {
        fill: var(--on-accent);
      }
      .s-trail {
        opacity: 0.35;
      }
      .s-note rect {
        fill: var(--surface);
        stroke-width: 1.5;
      }
      .s-note text {
        fill: var(--text);
        font: 600 14px var(--sans);
      }
      .s-pulse {
        fill: none;
        stroke-width: 2;
      }
      .s-x {
        stroke: var(--red);
        stroke-width: 3;
        stroke-linecap: round;
      }
      [data-tone='mechanism'] > .s-shape,
      [data-tone='mechanism'].s-cell {
        stroke: var(--blue);
        fill: color-mix(in oklch, var(--blue) 16%, var(--surface-2));
      }
      [data-tone='success'] > .s-shape,
      [data-tone='success'].s-cell {
        stroke: var(--green);
        fill: color-mix(in oklch, var(--green) 16%, var(--surface-2));
      }
      [data-tone='failure'] > .s-shape,
      [data-tone='failure'].s-cell {
        stroke: var(--red);
        fill: color-mix(in oklch, var(--red) 16%, var(--surface-2));
      }
      [data-tone='warning'] > .s-shape,
      [data-tone='warning'].s-cell {
        stroke: var(--amber);
        fill: color-mix(in oklch, var(--amber) 16%, var(--surface-2));
      }
      [data-tone='repeated'] > .s-shape,
      [data-tone='repeated'].s-cell {
        stroke: var(--purple);
        fill: color-mix(in oklch, var(--purple) 16%, var(--surface-2));
      }
      [data-tone='context'] > .s-shape {
        stroke: var(--border);
      }
      [data-tone='muted'] > .s-shape,
      [data-tone='muted'].s-cell {
        opacity: 0.45;
      }
      @media (prefers-reduced-motion: reduce) {
        .s-link.active {
          animation: none;
        }
        .s-trail {
          display: none;
        }
      }
      @media (max-width: 980px) {
        .mp-work.with-side {
          grid-template-columns: minmax(0, 1fr);
        }
        .mp-divider {
          display: none;
        }
        .mp-stages.compare {
          grid-template-columns: minmax(0, 1fr);
          gap: 10px;
        }
        .mp-cmp-divider {
          display: none !important;
        }
        .mp-transport {
          grid-template-columns: 1fr;
        }
        .mp-transport .mp-group {
          flex-wrap: wrap;
        }
        .mp-time {
          text-align: left;
        }
      }
      /*__DIAGRAM_DESIGN__*/
      .embedded .mp-top,
      .embedded .mp-head {
        display: none;
      }
      .embedded .mp {
        padding: 12px 18px 18px;
      }
      .embedded .mp-stage {
        height: min(400px, 45vh);
      }
      .embedded .mp-caption {
        height: 96px;
      }
      .mp-input-error {
        color: var(--red);
        font-size: 12px;
        max-width: 340px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="mp" id="mp">
      <div class="mp-top">
        <a class="mp-home" id="mp-home" href="/">&larr; Motion Lab</a
        ><button
          class="mp-btn mp-icon"
          id="mp-theme"
          type="button"
          aria-label="Theme: follows your system"
          title="Theme: follows your system"
        ></button>
      </div>
      <header class="mp-head">
        <h1 id="mp-title"></h1>
        <p id="mp-subtitle"></p>
        <div class="mp-gen" id="mp-gen"></div>
      </header>
      <div class="mp-bar">
        <div class="mp-tabs" id="mp-variants" role="group" aria-label="Scenario"></div>
        <button
          class="mp-btn"
          id="mp-compare"
          type="button"
          aria-pressed="false"
          hidden
          title="Play two scenarios side by side on one timeline"
        >
          ⇆ Compare
        </button>
        <button
          class="mp-btn"
          id="mp-maximize"
          type="button"
          aria-pressed="false"
          hidden
          title="Fill the whole window (Esc exits)"
        >
          ⤢ Maximize
        </button>
        <span style="flex: 1"></span>
        <button class="mp-btn" id="mp-side-toggle" type="button" aria-pressed="false">
          Inspector ▸
        </button>
      </div>
      <form class="mp-params" id="mp-params" hidden></form>
      <div class="mp-edges" id="mp-edges" hidden><span class="lbl">Edge cases</span></div>
      <div class="mp-work" id="mp-work">
        <div class="mp-main" id="mp-main">
          <div class="mp-caption" id="mp-caption" aria-live="polite">
            <span class="mp-count" id="mp-count"></span>
            <h2 id="mp-cap-title"></h2>
            <p id="mp-cap-text"></p>
            <div class="mp-cap-b" id="mp-cap-b" hidden></div>
          </div>
          <div class="mp-stages" id="mp-stages">
            <div class="mp-stage-wrap" id="mp-wrap-a">
              <div class="mp-badge" id="mp-badge-a" hidden></div>
              <svg class="mp-stage" id="mp-stage-a" role="img" aria-labelledby="mp-title"></svg>
              <span class="mp-stage-label" id="mp-label-a" hidden></span>
              <div class="mp-overlay" id="mp-overlay">
                <button class="mp-bigplay" id="mp-bigplay" type="button">▶ Play</button>
              </div>
              <div class="mp-overlay" id="mp-predict-layer" hidden>
                <div class="mp-predict" role="dialog" aria-live="polite">
                  <h2>Predict before it happens</h2>
                  <p id="mp-predict-q"></p>
                  <div class="mp-answer" id="mp-predict-a" hidden></div>
                  <div style="display: flex; gap: 8px; margin-top: 12px">
                    <button class="mp-btn" id="mp-reveal" type="button">Show answer</button>
                    <button class="mp-btn" id="mp-continue" type="button" aria-pressed="true">
                      Watch it ▶
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <div
              class="mp-cmp-divider"
              id="mp-cmp-divider"
              role="separator"
              aria-orientation="vertical"
              aria-label="Resize the two compared scenarios"
              tabindex="0"
              hidden
            ></div>
            <div class="mp-stage-wrap" id="mp-wrap-b" hidden>
              <div class="mp-badge" id="mp-badge-b" hidden></div>
              <svg
                class="mp-stage"
                id="mp-stage-b"
                role="img"
                aria-label="Comparison scenario"
              ></svg>
              <span class="mp-stage-label" id="mp-label-b"></span>
            </div>
          </div>
          <div class="mp-transport">
            <div class="mp-group">
              <button class="mp-btn" id="mp-prev" type="button" title="Previous chapter (←)">
                ⏮
              </button>
              <button
                class="mp-btn"
                id="mp-play"
                type="button"
                title="Play / pause (space)"
                style="min-width: 74px"
              >
                ▶ Play
              </button>
              <button class="mp-btn" id="mp-next" type="button" title="Next chapter (→)">⏭</button>
            </div>
            <div class="mp-scrub">
              <div class="mp-ticks" id="mp-ticks"></div>
              <input
                id="mp-scrub"
                type="range"
                min="0"
                max="1000"
                step="1"
                value="0"
                aria-label="Timeline"
              />
            </div>
            <div class="mp-group">
              <span class="mp-time" id="mp-time">0.0 / 0.0 s</span>
              <button class="mp-btn" data-speed="0.5" type="button" aria-pressed="false">
                0.5×
              </button>
              <button class="mp-btn" data-speed="1" type="button" aria-pressed="true">1×</button>
              <button class="mp-btn" data-speed="2" type="button" aria-pressed="false">2×</button>
            </div>
          </div>
          <div class="mp-chapters" id="mp-chapters" aria-label="Chapters"></div>
          <div class="mp-legend">
            <span style="--c: var(--blue)">happening now</span
            ><span style="--c: var(--green)">correct / done</span>
            <span style="--c: var(--red)">failure</span
            ><span style="--c: var(--amber)">waiting / risk / edge</span
            ><span style="--c: var(--purple)">repeated work / in flight</span>
          </div>
          <div class="mp-opts">
            <label><input type="checkbox" id="mp-predict-mode" /> Pause to predict</label>
            <label
              ><input type="checkbox" id="mp-camera" checked /> Camera follows the action</label
            >
            <span>Keys: space play · ← → chapters · Home / End · C compare · I inspector</span>
          </div>
        </div>
        <div
          class="mp-divider"
          id="mp-divider"
          role="separator"
          aria-orientation="vertical"
          aria-label="Resize diagram and side panel"
          tabindex="0"
          hidden
        ></div>
        <aside class="mp-side" id="mp-side" hidden>
          <div class="mp-side-tabs" role="tablist">
            <button type="button" role="tab" data-panel="inspector" aria-selected="true">
              Inspector
            </button>
            <button type="button" role="tab" data-panel="code" aria-selected="false" hidden>
              Code
            </button>
            <button type="button" role="tab" data-panel="complexity" aria-selected="false" hidden>
              Time &amp; space
            </button>
            <button type="button" role="tab" data-panel="reference" aria-selected="false" hidden>
              Reference
            </button>
            <button type="button" class="close" id="mp-side-close" title="Hide panel">✕</button>
          </div>
          <div class="mp-inspector" id="mp-panel-inspector"></div>
          <div class="mp-code" id="mp-panel-code" hidden>
            <div class="mp-code-body" id="mp-code-body"></div>
          </div>
          <div class="mp-cx" id="mp-panel-complexity" hidden></div>
          <div class="mp-cx mp-ref" id="mp-panel-reference" hidden></div>
        </aside>
      </div>
    </div>
    <script id="motion-spec" type="application/json">
      __MOTION_SPEC__
    </script>
    <script>
      /*__PLAYER__*/
    </script>
  </body>
</html>
